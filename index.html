<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain of Love - Hiệu ứng mưa trái tim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to bottom, #1a001a, #4d004d, #1a001a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
        }

        .title {
            z-index: 10;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
            pointer-events: none;
        }

        .heart-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            top: -50px;
            font-size: 20px;
            user-select: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="title">Rain of Love ❤️</div>
    <div class="heart-rain" id="heartRain"></div>

    <script>
        const heartEmojis = ['❤️', '💖', '💘', '💝', '💕', '💗', '💓'];
        const container = document.getElementById('heartRain');

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            const duration = Math.random() * 3 + 2; // từ 2s đến 5s
            heart.style.animationDuration = duration + 's';

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Tạo trái tim mới mỗi 200 mili-giây
        setInterval(createHeart, 200);
    </script>

</body>
</html>
